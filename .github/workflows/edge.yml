name: edge-image
# Builds and publishes the Aether Edge agent image (docs/platform/aether-edge.md) for linux/amd64 and linux/arm64.
# Publishing happens only for tags edge-v<semver> (e.g. edge-v0.1.0 → ghcr.io/<owner>/aether-edge:0.1.0); a manual
# run builds and tests without pushing. After the first push, make the package public once:
# GitHub → Packages → aether-edge → Package settings → Change visibility → Public.
# Actions are pinned to full commit SHAs (the version tag is in the comment).
on:
  push:
    tags: ['edge-v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: edge-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: backend/go.sum
      - name: Test the agent and its protocol library
        working-directory: backend
        run: go test -race ./internal/edge/... ./internal/tuyalocal/... ./internal/tuyable/... ./cmd/aether-edge/... ./internal/edgeinstall/...
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#edge-v}"
            case "$v" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "tag must be edge-v<major>.<minor>.<patch>" >&2; exit 1 ;;
            esac
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.version.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on a release tag)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          file: backend/edge.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.version.outputs.push == 'true' }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aether-edge:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/aether-edge:latest-stable
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
