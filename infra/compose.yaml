name: aether
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a local .env first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate a local .env first}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-aether.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aether"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ../backend
    image: aether-backend:local
    entrypoint: ["/app/migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/aether?sslmode=disable
      # The login role (migration 00040) gets its password here, on every migrate.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run python3 infra/generate-env.py --add-missing}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    build: ../backend
    image: aether-backend:local
    environment:
      DATABASE_URL: postgresql://aether_app:${APP_DB_PASSWORD}@postgres:5432/aether?sslmode=disable
      # The only connection that can read a password hash (role aether_auth, migration 00040).
      AUTH_DATABASE_URL: postgresql://aether_auth:${AUTH_DB_PASSWORD:?Run python3 infra/generate-env.py --add-missing}@postgres:5432/aether?sslmode=disable
      APP_ENV: development
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-onprem}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      ALLOW_REGISTRATION: "false"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Generate a local .env first}
      LISTEN_ADDR: ":8080"
      # Development: browser pages, tests and curl all come from one loopback IP. Production default is 120.
      API_RATE_LIMIT: ${API_RATE_LIMIT:-600}
      # Automations may command devices only when this is true (docs/platform/automation.md).
      AUTOMATION_COMMANDS: ${AUTOMATION_COMMANDS:-false}
      # Tuya Cloud mode (docs/platform/tuya-cloud.md): off unless .env sets TUYA_CLOUD=true with a dev key pair. The
      # API gets only the public key; the private key goes to the tuya-cloud service alone.
      TUYA_CLOUD: ${TUYA_CLOUD:-false}
      TUYA_CLOUD_PUBLIC_KEY: ${TUYA_CLOUD_PUBLIC_KEY:-}
      TUYA_CLOUD_MAX_LINKS_PER_TENANT: ${TUYA_CLOUD_MAX_LINKS_PER_TENANT:-2}
      TUYA_CLOUD_EVENT_BUDGET: ${TUYA_CLOUD_EVENT_BUDGET:-68000}
      TUYA_CLOUD_API_BUDGET: ${TUYA_CLOUD_API_BUDGET:-26000}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  # Runs the Tuya Cloud links; the only holder of TUYA_CLOUD_PRIVATE_KEY (an aether_app DSN and nothing else). With
  # TUYA_CLOUD=false (the default) it idles, so it needs no key.
  tuya-cloud:
    build: ../backend
    image: aether-backend:local
    entrypoint: ["/app/tuya-cloud"]
    environment:
      DATABASE_URL: postgresql://aether_app:${APP_DB_PASSWORD}@postgres:5432/aether?sslmode=disable
      TUYA_CLOUD: ${TUYA_CLOUD:-false}
      TUYA_CLOUD_PRIVATE_KEY: ${TUYA_CLOUD_PRIVATE_KEY:-}
      TUYA_CLOUD_MAX_LINKS: ${TUYA_CLOUD_MAX_LINKS:-50}
      TUYA_CLOUD_MAX_LINKS_PER_TENANT: ${TUYA_CLOUD_MAX_LINKS_PER_TENANT:-2}
      TUYA_CLOUD_EVENT_BUDGET: ${TUYA_CLOUD_EVENT_BUDGET:-68000}
      TUYA_CLOUD_API_BUDGET: ${TUYA_CLOUD_API_BUDGET:-26000}
    healthcheck:
      test: ["CMD", "/app/tuya-cloud", "health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192m
volumes:
  postgres-data:
