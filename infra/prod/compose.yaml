# Aether — single-server production stack (on-premise first).
#
#   docker compose --env-file .env.prod -f infra/prod/compose.yaml <command>
#
# Standalone: it does NOT extend infra/compose.yaml and shares no volume with the development
# stack. Every value comes from the env file written by infra/prod/setup.py; missing values fail
# loudly (`:?`) instead of silently starting an insecure deployment.
name: aether-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

# The API must see the real client address for its per-IP rate limit, so TRUSTED_PROXIES names the
# proxy exactly. That is only possible with a fixed subnet and a fixed address for the proxy.
networks:
  aether:
    driver: bridge
    ipam:
      config:
        - subnet: ${AETHER_SUBNET:?run infra/prod/setup.py}
  # Outbound only, for the pitr service (ops webhook) and pitr-offsite (rclone). Nothing of the application is on it:
  # both reach PostgreSQL's files and socket through volumes, not the network.
  ops-egress:
    driver: bridge

volumes:
  # The database volume, by name, so a point-in-time restore can switch the cluster to a restored volume by changing
  # one line in the env file (restore-pitr.sh --cutover). External: compose never creates or deletes it (not even with
  # `down -v`); setup.py creates it on a new install, with the labels compose itself would have given it, and keeps
  # the name compose always used: aether-prod_postgres-data. A shell variable AETHER_PG_VOLUME overrides the env file
  # (compose precedence); the operator scripts warn when the two differ.
  postgres-data:
    external: true
    name: ${AETHER_PG_VOLUME:?run infra/prod/setup.py}
  postgres-certs:
  # The server socket, shared with the pitr service (pgBackRest connects through it with peer authentication). A
  # tmpfs, like the directory it replaces: nothing in it survives a restart.
  postgres-run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: mode=0775,nosuid,nodev,noexec,size=1m
  # pgBackRest's asynchronous archive-push queue (archive-async).
  pgbackrest-spool:
  # Health written by the pitr service (status.json) and the WAL-drop flag written by archive_command. Mounted with
  # nocopy everywhere: Docker copies an image directory's owner and mode onto an empty volume, which must not undo
  # prepare's 0775 (the backup service writes here through group 70).
  ops-status:
  mqtt-data:
  caddy-data:
  caddy-config:

services:
  # One-shot. PostgreSQL refuses a server key it does not own, and Mosquitto needs its persistence
  # directory owned by its unprivileged uid. Both are fixed here instead of by the operator, so the
  # same commands work on Linux and on a macOS test host.
  prepare:
    # The postgres image itself (pinned base, infra/prod/postgres/Dockerfile), so the certificate ends up owned by
    # whatever uid that image's "postgres" user has (70 on alpine).
    image: ${AETHER_POSTGRES_IMAGE:-aether-postgres:prod}
    build:
      context: ./postgres
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -euc
      - |
        cp /src/postgres/server.crt /pgcerts/server.crt
        cp /src/postgres/server.key /pgcerts/server.key
        chown postgres:postgres /pgcerts/server.crt /pgcerts/server.key
        chmod 0644 /pgcerts/server.crt
        chmod 0600 /pgcerts/server.key
        chown "$${MQTT_UID}:$${MQTT_GID}" /mqttdata
        chmod 0700 /mqttdata
        # pgBackRest runs as the postgres uid in both postgres (archive-push) and pitr (backups).
        chown postgres:postgres /pitr /spool /ops
        chmod 0750 /pitr /spool
        # Group-writable: the backup service (root, with group 70 added) records each dump's outcome here.
        chmod 0775 /ops
        echo "prepare: certificate installed for $$(id -u postgres), mosquitto data owned by $${MQTT_UID}"
    environment:
      MQTT_UID: ${MQTT_UID:?run infra/prod/setup.py}
      MQTT_GID: ${MQTT_GID:?run infra/prod/setup.py}
    volumes:
      - ${AETHER_SECRETS_DIR:?run infra/prod/setup.py}/postgres:/src/postgres:ro
      - postgres-certs:/pgcerts
      - mqtt-data:/mqttdata
      - ${AETHER_PITR_DIR:?run infra/prod/setup.py}:/pitr
      - pgbackrest-spool:/spool
      - ops-status:/ops:nocopy
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    restart: "no"
    logging: *logging
    networks: [aether]

  postgres:
    # postgres:18-alpine (same base, pinned by digest) plus pgBackRest: infra/prod/postgres/Dockerfile.
    image: ${AETHER_POSTGRES_IMAGE:-aether-postgres:prod}
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run infra/prod/setup.py}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Consumed only by init-db.sh, on a new volume.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run infra/prod/setup.py}
      MQTT_PROVISION_DB_PASSWORD: ${MQTT_PROVISION_DB_PASSWORD:?run infra/prod/setup.py}
    command:
      - postgres
      # TLS is not optional: APP_ENV=production refuses a DATABASE_URL without sslmode=verify-full.
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - track_io_timing=on
      # Slow-query visibility without logging every statement.
      - -c
      - log_min_duration_statement=500
      - -c
      - log_checkpoints=on
      - -c
      - log_lock_waits=on
      - -c
      - log_autovacuum_min_duration=1000
      - -c
      - log_temp_files=0
      - -c
      - log_line_prefix=%m [%p] %u@%d
      - -c
      - timezone=UTC
      # sensor_samples, gateway_packets and ble_observations are delete-heavy (retention worker):
      # vacuum far more eagerly than the defaults so dead tuples do not accumulate between runs.
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_max_workers=4
      - -c
      - autovacuum_vacuum_scale_factor=0.02
      - -c
      - autovacuum_analyze_scale_factor=0.01
      - -c
      - autovacuum_vacuum_threshold=1000
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - autovacuum_vacuum_cost_delay=2ms
      # Continuous WAL archiving for point-in-time recovery (docs/production.md §7.1). archive_timeout bounds the
      # data a restore can lose on a quiet system to 5 minutes. archive-push is asynchronous and capped
      # (archive-push-queue-max in pgbackrest.conf): when the repository is unreachable for long, WAL is dropped and
      # alerted on instead of filling pg_wal and stopping the database.
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/aether-pgbackrest-push %p
      - -c
      - archive_timeout=300
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-certs:/certs:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-aether.sh:ro
      - postgres-run:/var/run/postgresql
      - ${AETHER_PITR_DIR:?run infra/prod/setup.py}:/var/lib/pgbackrest
      - pgbackrest-spool:/var/spool/pgbackrest
      - ${AETHER_SECRETS_DIR}/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ops-status:/run/aether-ops:nocopy
    # No published port. The database is reachable only from this compose network.
    shm_size: 256mb
    # Room for a clean shutdown (checkpoint) before Docker kills it; a cutover stops and starts it.
    stop_grace_period: 120s
    # A real init as PID 1: pgBackRest's asynchronous archive-push daemonizes, and an orphan is re-parented to PID 1.
    # If the postmaster were PID 1, an orphan exiting non-zero (repository unreachable) would count as a crashed
    # backend and restart the whole server.
    init: true
    healthcheck:
      # Run as the postgres OS user: pg_hba.conf uses peer for the local socket, so a probe from
      # root would log a FATAL authentication line every interval for the life of the server.
      test: ["CMD-SHELL", "gosu postgres pg_isready -U postgres -d aether"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      prepare:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    # The stock entrypoint starts as root and drops to uid 999 with su-exec.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging
    networks: [aether]
    deploy:
      resources:
        limits:
          memory: 2g

  migrate:
    image: ${AETHER_BACKEND_IMAGE:-aether-backend:prod}
    build:
      context: ../../backend
    entrypoint: ["/app/migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/aether?sslmode=verify-full&sslrootcert=/run/db-ca/ca.crt
    volumes:
      - ${AETHER_SECRETS_DIR}/db-ca:/run/db-ca:ro
    depends_on:
      postgres:
        condition: service_healthy
    <<: *hardened
    restart: "no"
    logging: *logging
    networks: [aether]

  api:
    image: ${AETHER_BACKEND_IMAGE:-aether-backend:prod}
    build:
      context: ../../backend
    environment:
      DATABASE_URL: postgresql://aether_app:${APP_DB_PASSWORD}@postgres:5432/aether?sslmode=verify-full&sslrootcert=/run/db-ca/ca.crt
      APP_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?run infra/prod/setup.py}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-onprem}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      LISTEN_ADDR: ":8080"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?run infra/prod/setup.py}
      CHANNEL_SEAL_KEY: ${CHANNEL_SEAL_KEY:?run infra/prod/setup.py}
      # Only then is X-Forwarded-For believed; Caddy overwrites that header (see Caddyfile).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?run infra/prod/setup.py}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-300}
      SAMPLE_RETENTION_DAYS: ${SAMPLE_RETENTION_DAYS:-90}
      SAMPLE_MIN_INTERVAL_SEC: ${SAMPLE_MIN_INTERVAL_SEC:-30}
      BLE_HISTORY_HOURS: ${BLE_HISTORY_HOURS:-24}
      DISCOVERY_LIMIT: ${DISCOVERY_LIMIT:-100}
      ALERTS_SHADOW: ${ALERTS_SHADOW:-true}
      AUTOMATION_COMMANDS: ${AUTOMATION_COMMANDS:-false}
      # Tuya Cloud mode (docs/platform/tuya-cloud.md). The API only SEALS project credentials to the worker's public
      # key; the private key is given to the tuya-cloud service alone. The budgets are shown as usage bars.
      TUYA_CLOUD: ${TUYA_CLOUD:-false}
      TUYA_CLOUD_PUBLIC_KEY: ${TUYA_CLOUD_PUBLIC_KEY:-}
      TUYA_CLOUD_MAX_LINKS_PER_TENANT: ${TUYA_CLOUD_MAX_LINKS_PER_TENANT:-2}
      TUYA_CLOUD_EVENT_BUDGET: ${TUYA_CLOUD_EVENT_BUDGET:-68000}
      TUYA_CLOUD_API_BUDGET: ${TUYA_CLOUD_API_BUDGET:-26000}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Shown by the UI on the "connect a device" page; must be what an MG3 on the LAN can reach.
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:?run infra/prod/setup.py}
      MQTT_PUBLIC_PORT: ${MQTT_PUBLIC_PORT:-8883}
      MQTT_PUBLIC_SCHEME: ${MQTT_PUBLIC_SCHEME:-ssl}
      MQTT_ALLOW_PLAINTEXT: ${MQTT_ALLOW_PLAINTEXT:-false}
      MQTT_PLAIN_PORT: ${MQTT_PLAIN_PORT:-1883}
      # Handed to an Aether Edge installer with its credentials (POST /edge/bootstrap/<code>): the broker's CA,
      # and the web front's root when it is a private CA (optional; see docs/production.md).
      MQTT_CA_FILE: /run/mqtt-ca/ca.crt
      EDGE_WEB_CA_FILE: /run/edge-web-ca/root.crt
    volumes:
      - ${AETHER_SECRETS_DIR}/db-ca:/run/db-ca:ro
      # The broker's CA certificate only (public): never the broker directory, which holds its private key.
      - ${AETHER_SECRETS_DIR}/mqtt/broker/ca.crt:/run/mqtt-ca/ca.crt:ro
      - ${AETHER_SECRETS_DIR}/edge-web-ca:/run/edge-web-ca:ro
    healthcheck:
      test: ["CMD", "/app/api", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    # create-owner.sh writes the password file here, inside the container, as uid 10001.
    tmpfs:
      - /tmp:mode=1777,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging
    networks: [aether]
    deploy:
      resources:
        limits:
          memory: 1g

  mqtt:
    image: eclipse-mosquitto:2.0.22
    user: "${MQTT_UID}:${MQTT_GID}"
    entrypoint: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ${AETHER_SECRETS_DIR}/mqtt/broker:/mosquitto/config:ro
      - ${AETHER_SECRETS_DIR}/mqtt/runtime:/mosquitto/runtime:ro
      - mqtt-data:/mosquitto/data
    ports:
      # TLS listener for gateways.
      - "${MQTT_BIND_IP:-0.0.0.0}:${MQTT_PORT:-8883}:8883"
      # Plaintext listener only exists when setup.py ran with --mqtt-plaintext; otherwise this is bound to
      # loopback and nothing listens behind it inside the container.
      - "${MQTT_PLAIN_BIND:-127.0.0.1}:${MQTT_PLAIN_PORT:-1883}:1883"
    healthcheck:
      # A TLS handshake that ends in "not authorised" (exit 5) proves the listener, the certificate
      # chain and the authentication stack are all alive without embedding a password here.
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h mqtt -p 8883 --cafile /mosquitto/config/ca.crt
          -i aether-healthcheck -u aether-healthcheck -P invalid
          -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1;
          s=$$?; [ "$$s" = 5 ] || [ "$$s" = 0 ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      prepare:
        condition: service_completed_successfully
    <<: *hardened
    restart: unless-stopped
    logging: *logging
    networks: [aether]
    deploy:
      resources:
        limits:
          memory: 512m

  mqtt-ingest:
    image: ${AETHER_BACKEND_IMAGE:-aether-backend:prod}
    build:
      context: ../../backend
    entrypoint: ["/app/mqtt"]
    environment:
      DATABASE_URL: postgresql://aether_app:${APP_DB_PASSWORD}@postgres:5432/aether?sslmode=verify-full&sslrootcert=/run/db-ca/ca.crt
      APP_ENV: production
      APP_ORIGIN: ${APP_ORIGIN}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-onprem}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      CHANNEL_SEAL_KEY: ${CHANNEL_SEAL_KEY}
      SAMPLE_RETENTION_DAYS: ${SAMPLE_RETENTION_DAYS:-90}
      SAMPLE_MIN_INTERVAL_SEC: ${SAMPLE_MIN_INTERVAL_SEC:-30}
      BLE_HISTORY_HOURS: ${BLE_HISTORY_HOURS:-24}
      DISCOVERY_LIMIT: ${DISCOVERY_LIMIT:-100}
      ALERTS_SHADOW: ${ALERTS_SHADOW:-true}
      AUTOMATION_COMMANDS: ${AUTOMATION_COMMANDS:-false}
      TUYA_CLOUD: ${TUYA_CLOUD:-false}
      MQTT_CONFIG_FILE: /run/mqtt/collector.json
    volumes:
      - ${AETHER_SECRETS_DIR}/mqtt/collector:/run/mqtt:ro
      - ${AETHER_SECRETS_DIR}/db-ca:/run/db-ca:ro
    healthcheck:
      test: ["CMD", "/app/mqtt", "health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
    <<: *hardened
    restart: unless-stopped
    logging: *logging
    networks: [aether]
    deploy:
      resources:
        limits:
          memory: 512m

  # Publishes queued device commands (core.device_commands) to Zigbee2MQTT bridges. Its broker account may only
  # WRITE aether/z2m/+/+/set (no subscription, no bridge/request/*); it claims and commits each command before
  # publishing it, so a command is delivered at most once and never late. See docs/platform/zigbee2mqtt.md.
  mqtt-commander:
    image: ${AETHER_BACKEND_IMAGE:-aether-backend:prod}
    build:
      context: ../../backend
    entrypoint: ["/app/mqtt-commander"]
    environment:
      DATABASE_URL: postgresql://aether_app:${APP_DB_PASSWORD}@postgres:5432/aether?sslmode=verify-full&sslrootcert=/run/db-ca/ca.crt
      MQTT_CONFIG_FILE: /run/mqtt/commander.json
    volumes:
      - ${AETHER_SECRETS_DIR}/mqtt/commander:/run/mqtt:ro
      - ${AETHER_SECRETS_DIR}/db-ca:/run/db-ca:ro
    healthcheck:
      test: ["CMD", "/app/mqtt-commander", "health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
    <<: *hardened
    restart: unless-stopped
    logging: *logging
    networks: [aether]
    deploy:
      resources:
        limits:
          memory: 128m

  # Runs every Tuya Cloud link (docs/platform/tuya-cloud.md): consumes each linked project's Message Service, syncs
  # its devices and delivers cloud commands through the Tuya OpenAPI. It is the only holder of
  # TUYA_CLOUD_PRIVATE_KEY, so the only process that can open a project's credentials; it gets an aether_app DSN and
  # nothing else (no JWT or channel seal key, no broker account). It needs egress to Tuya (HTTPS 443 and the
  # Message Service's Pulsar port 8285), which the aether bridge network gives it. With TUYA_CLOUD=false it idles.
  tuya-cloud:
    image: ${AETHER_BACKEND_IMAGE:-aether-backend:prod}
    build:
      context: ../../backend
    entrypoint: ["/app/tuya-cloud"]
    environment:
      DATABASE_URL: postgresql://aether_app:${APP_DB_PASSWORD}@postgres:5432/aether?sslmode=verify-full&sslrootcert=/run/db-ca/ca.crt
      TUYA_CLOUD: ${TUYA_CLOUD:-false}
      TUYA_CLOUD_PRIVATE_KEY: ${TUYA_CLOUD_PRIVATE_KEY:?run infra/prod/setup.py}
      TUYA_CLOUD_MAX_LINKS: ${TUYA_CLOUD_MAX_LINKS:-50}
      TUYA_CLOUD_MAX_LINKS_PER_TENANT: ${TUYA_CLOUD_MAX_LINKS_PER_TENANT:-2}
      TUYA_CLOUD_EVENT_BUDGET: ${TUYA_CLOUD_EVENT_BUDGET:-68000}
      TUYA_CLOUD_API_BUDGET: ${TUYA_CLOUD_API_BUDGET:-26000}
    volumes:
      - ${AETHER_SECRETS_DIR}/db-ca:/run/db-ca:ro
    healthcheck:
      test: ["CMD", "/app/tuya-cloud", "health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    <<: *hardened
    restart: unless-stopped
    logging: *logging
    networks: [aether]
    deploy:
      resources:
        limits:
          memory: 192m

  # Renders broker credentials for gateways created in the web UI and SIGHUPs Mosquitto through a
  # shared PID namespace. It never gets a Docker socket and can only read password hashes.
  mqtt-provisioner:
    image: ${AETHER_BACKEND_IMAGE:-aether-backend:prod}
    build:
      context: ../../backend
    entrypoint: ["/app/mqtt-provisioner"]
    user: "${MQTT_UID}:${MQTT_GID}"
    pid: "service:mqtt"
    environment:
      DATABASE_URL: postgresql://aether_mqtt_provisioner:${MQTT_PROVISION_DB_PASSWORD}@postgres:5432/aether?sslmode=verify-full&sslrootcert=/run/db-ca/ca.crt
    volumes:
      - ${AETHER_SECRETS_DIR}/mqtt/broker/passwords:/run/mqtt-base/passwords:ro
      - ${AETHER_SECRETS_DIR}/mqtt/broker/acl:/run/mqtt-base/acl:ro
      - ${AETHER_SECRETS_DIR}/mqtt/runtime:/run/mqtt-runtime
      - ${AETHER_SECRETS_DIR}/db-ca:/run/db-ca:ro
    depends_on:
      mqtt:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    <<: *hardened
    restart: unless-stopped
    logging: *logging
    networks: [aether]
    deploy:
      resources:
        limits:
          memory: 128m

  web:
    image: ${AETHER_WEB_IMAGE:-aether-web:prod}
    build:
      context: ../../frontend
    # No published port: only the proxy talks to it. HEALTHCHECK comes from the image.
    <<: *hardened
    tmpfs:
      - /tmp:mode=1777,size=16m
    restart: unless-stopped
    logging: *logging
    networks: [aether]
    deploy:
      resources:
        limits:
          memory: 768m

  proxy:
    image: caddy:2-alpine
    environment:
      AETHER_SITE: ${AETHER_SITE:?run infra/prod/setup.py}
      AETHER_HTTP_SITE: ${AETHER_HTTP_SITE:?run infra/prod/setup.py}
      AETHER_TLS: ${AETHER_TLS:?run infra/prod/setup.py}
      AETHER_CSP_HEADER: ${AETHER_CSP_HEADER:-Content-Security-Policy}
      AETHER_HOST: ${AETHER_HOST:?run infra/prod/setup.py}
      AETHER_HTTPS_PORT: ${AETHER_HTTPS_PORT:-443}
      AETHER_UPSTREAM_PROXIES: ${AETHER_UPSTREAM_PROXIES:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ${AETHER_CADDY_LOG_DIR:?run infra/prod/setup.py}:/var/log/caddy
    ports:
      # 127.0.0.1 when an outer reverse proxy on this host is the only way in (setup.py --web-bind).
      - "${AETHER_WEB_BIND:-0.0.0.0}:${AETHER_HTTPS_PORT:-443}:${AETHER_HTTPS_PORT:-443}"
      - "${AETHER_WEB_BIND:-0.0.0.0}:${AETHER_HTTP_PORT:-80}:${AETHER_HTTP_PORT:-80}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -k -o /dev/null
          --resolve "$${AETHER_HOST}:$${AETHER_HTTPS_PORT}:127.0.0.1"
          "https://$${AETHER_HOST}:$${AETHER_HTTPS_PORT}/health/live"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    # Only to bind 80/443 as an unprivileged process inside the container.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging
    networks:
      aether:
        ipv4_address: ${AETHER_PROXY_IP:?run infra/prod/setup.py}
    deploy:
      resources:
        limits:
          memory: 256m

  # Nightly pg_dump --format=custom with a pg_restore --list integrity check and 14 daily + 8 weekly
  # retention. Logical and portable across major versions; point-in-time recovery is the pitr service.
  backup:
    image: ${AETHER_POSTGRES_IMAGE:-aether-postgres:prod}
    build:
      context: ./postgres
    entrypoint: ["/bin/sh", "/opt/aether/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: aether
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/db-ca/ca.crt
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      TZ: ${AETHER_TZ:-Asia/Bangkok}
    volumes:
      - ./backup.sh:/opt/aether/backup.sh:ro
      - ./backup-loop.sh:/opt/aether/backup-loop.sh:ro
      - ./restore-inner.sh:/opt/aether/restore-inner.sh:ro
      - ${AETHER_SECRETS_DIR}/db-ca:/run/db-ca:ro
      - ${AETHER_BACKUP_DIR:?run infra/prod/setup.py}:/backups
      # dump-last-ok / dump-failed, read by the pitr service's checks.
      - ops-status:/run/aether-ops:nocopy
    # Write access to ops-status (owned by the postgres uid, mode 0775) without any capability.
    group_add: ["70"]
    healthcheck:
      # Healthy while a verified dump from the last 26 hours exists (backup-loop.sh takes one at start if not).
      test: ["CMD-SHELL", "find /backups/daily -name 'aether-*.dump' -mmin -1560 | grep -q . && test ! -f /run/aether-ops/dump-failed"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 30m
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging
    networks: [aether]
    deploy:
      resources:
        limits:
          memory: 256m

  # Point-in-time recovery: pgBackRest full/differential backups on a schedule (the WAL itself is pushed by the
  # postgres service's archive_command), and the operations checks — archiver failures, WAL backlog, pg_wal size,
  # backup and dump age, backup disk — reported as "PITR ALERT" log lines, to OPS_WEBHOOK_URL, and in status.json
  # (the healthcheck). Runs as the postgres uid, reads the data directory, and reaches the server only through
  # the shared socket. See infra/prod/pitr-loop.sh and docs/production.md §7.1.
  pitr:
    image: ${AETHER_POSTGRES_IMAGE:-aether-postgres:prod}
    build:
      context: ./postgres
    user: "70:70"
    entrypoint: ["/bin/sh", "/opt/aether/pitr-loop.sh"]
    environment:
      PITR_BACKUP_AT: ${PITR_BACKUP_AT:-03:30}
      PITR_FULL_DAY: ${PITR_FULL_DAY:-7}
      PITR_CHECK_SECONDS: ${PITR_CHECK_SECONDS:-300}
      PITR_REPO_MIN_FREE_PERCENT: ${PITR_REPO_MIN_FREE_PERCENT:-15}
      # Names the server in alert messages.
      OPS_HOST: ${AETHER_HOST:-}
      TZ: ${AETHER_TZ:-Asia/Bangkok}
    volumes:
      - ./pitr-loop.sh:/opt/aether/pitr-loop.sh:ro
      # pgBackRest copies the data files; it never writes to the data directory.
      - postgres-data:/var/lib/postgresql:ro
      - postgres-run:/var/run/postgresql
      - ${AETHER_PITR_DIR}:/var/lib/pgbackrest
      - ${AETHER_SECRETS_DIR}/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ops-status:/run/aether-ops:nocopy
      # webhook-url (0400, postgres uid): the URL is a credential for most webhook services, so it is not in the env.
      - ${AETHER_SECRETS_DIR}/ops:/run/secrets/ops:ro
    healthcheck:
      # Fresh (written in the last 15 minutes) and without an active alert.
      test:
        - CMD-SHELL
        - >-
          test $$(( $$(date +%s) - $$(stat -c %Y /run/aether-ops/status.json) )) -lt 900
          && grep -q '"ok":true' /run/aether-ops/status.json
      interval: 1m
      timeout: 10s
      retries: 2
      # The first full backup runs before the first status is written.
      start_period: 2h
    depends_on:
      postgres:
        condition: service_healthy
    <<: *hardened
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *logging
    networks: [ops-egress]
    deploy:
      resources:
        limits:
          memory: 512m

  # Optional (setup.py --offsite): copies the pgBackRest repository (already encrypted) and the nightly dumps to an
  # rclone remote every OFFSITE_EVERY seconds. Separate from archiving on purpose: an unreachable remote must never
  # block WAL archiving. Point OFFSITE_TARGET at an rclone `crypt` remote: the dumps are not encrypted themselves.
  # Files deleted locally by retention are moved to <target>/deleted/<date> on the remote, not deleted there.
  pitr-offsite:
    profiles: [offsite]
    image: rclone/rclone:1.71.1@sha256:d5971950c2b370fb04dd3292541b5bda6d9103143fd7e345aeb435a399388afc
    # Root without any capability: owner of the dumps (root, 0600) and, through group 70, reader of the pgBackRest
    # repository (postgres uid, 0640).
    user: "0:70"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "off-site copy to $${OFFSITE_TARGET} every $${OFFSITE_EVERY}s"
        while true; do
          day="$$(date -u +%Y-%m-%d)"
          for part in pitr dumps; do
            if rclone sync "/data/$$part" "$${OFFSITE_TARGET}/$$part" --backup-dir "$${OFFSITE_TARGET}/deleted/$$day/$$part" \
                 --exclude '*.part' --stats-one-line --stats 0 -q; then
              echo "off-site copy of $$part ok"
              date -u +%s > "/tmp/offsite-$$part.ok"
            else
              echo "PITR ALERT offsite_failed: off-site copy of $$part to $${OFFSITE_TARGET} failed" >&2
            fi
          done
          sleep "$${OFFSITE_EVERY}"
        done
    environment:
      OFFSITE_TARGET: ${OFFSITE_TARGET:-}
      OFFSITE_EVERY: ${OFFSITE_EVERY:-900}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      HOME: /tmp
    volumes:
      - ${AETHER_PITR_DIR}:/data/pitr:ro
      - ${AETHER_BACKUP_DIR}:/data/dumps:ro
      - ${AETHER_SECRETS_DIR}/rclone:/config/rclone:ro
    healthcheck:
      test: ["CMD-SHELL", "for p in pitr dumps; do test $$(( $$(date -u +%s) - $$(cat /tmp/offsite-$$p.ok) )) -lt 3600 || exit 1; done"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 1h
    <<: *hardened
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *logging
    networks: [ops-egress]
    deploy:
      resources:
        limits:
          memory: 256m
